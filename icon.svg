<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a2b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <radialGradient id="capGrad" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </radialGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="90" fill="#0f172a" stroke="#34d199" stroke-width="8" stroke-opacity="0.8" />
  
  <!-- Mushroom Cap -->
  <path d="M 110 300 C 110 160, 402 160, 402 300 C 370 310, 142 310, 110 300 Z" fill="url(#capGrad)" />
  
  <!-- Mushroom Spots -->
  <circle cx="195" cy="210" r="18" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="180" r="22" fill="#ffffff" opacity="0.95" />
  <circle cx="317" cy="210" r="18" fill="#ffffff" opacity="0.95" />
  <circle cx="165" cy="260" r="15" fill="#ffffff" opacity="0.95" />
  <circle cx="256" cy="250" r="20" fill="#ffffff" opacity="0.95" />
  <circle cx="347" cy="260" r="15" fill="#ffffff" opacity="0.95" />

  <!-- Mushroom Stem -->
  <path d="M 220 295 L 220 390 C 220 405, 292 405, 292 390 L 292 295 Z" fill="#fffbeb" />
  
  <!-- Grass Bed -->
  <path d="M 180 395 Q 256 385 332 395 Q 256 405 180 395 Z" fill="#10b981" />
</svg>
